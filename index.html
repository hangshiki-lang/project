<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmarket-like Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="gmarket-header">
        <div class="header-top">
            <div class="logo">Gmarket</div>
            <div class="search-bar">
                <input type="text" placeholder="Search Gmarket">
                <button>Search</button>
            </div>
            <nav class="user-nav">
                <button id="theme-toggle">Toggle Theme</button>
                <a href="#">Login</a>
                <a href="#">Cart</a>
            </nav>
        </div>
        <nav class="main-nav">
            <a href="#">Category 1</a>
            <a href="#">Category 2</a>
            <a href="#">Category 3</a>
        </nav>
    </header>

    <main class="gmarket-main-content">
        <section class="banners">
            <h2>Promotions & Banners</h2>
            <div class="banner-item">Banner 1</div>
            <div class="banner-item">Banner 2</div>
            <div class="banner-item">Banner 3</div>
        </section>

        <section class="product-grid">
            <h2>Featured Products</h2>
            <div class="product-item">
                <img src="https://via.placeholder.com/150" alt="Product Image">
                <h3>Product Title 1</h3>
                <p>₩15,000</p>
            </div>
            <div class="product-item">
                <img src="https://via.placeholder.com/150" alt="Product Image">
                <h3>Product Title 2</h3>
                <p>₩25,000</p>
            </div>
            <div class="product-item">
                <img src="https://via.placeholder.com/150" alt="Product Image">
                <h3>Product Title 3</h3>
                <p>₩10,000</p>
            </div>
            <div class="product-item">
                <img src="https://via.placeholder.com/150" alt="Product Image">
                <h3>Product Title 4</h3>
                <p>₩30,000</p>
            </div>
        </section>
    </main>

    <footer class="gmarket-footer">
        <div class="footer-links">
            <a href="#">About Us</a>
            <a href="#">Customer Service</a>
            <a href="#">Terms & Conditions</a>
        </div>
        <p>&copy; 2023 Gmarket Clone</p>
    </footer>

    <script src="main.js"></script>
